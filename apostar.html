<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03120a">
    <title>Escolha os Palpites - Bicho777Bet</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #020d07 radial-gradient(circle at 50% 25%, #083b1d 0%, #03150b 50%, #010804 100%) no-repeat fixed;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 12px;
            background: radial-gradient(ellipse at 50% 0%, rgba(0, 255, 100, 0.15) 0%, transparent 70%);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 50px;
            border-bottom: 1px solid rgba(0, 255, 120, 0.15);
            margin-bottom: 12px;
        }

        .back-button {
            color: #ffc200;
            font-size: 24px;
            text-decoration: none;
            font-weight: bold;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ffc200;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ffc200;
            font-weight: bold;
        }

        .grid-numbers {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-bottom: 16px;
        }

        .bet-num-btn {
            background: linear-gradient(180deg, #022e14 0%, #01190a 100%);
            border: 1px solid #10e36b;
            border-radius: 5px;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 8px 0;
            cursor: pointer;
            text-align: center;
        }

        .bet-num-btn.selected {
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 100%);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 6px #ffc200;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: 1px solid #fff2a3;
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 60%, #c47f00 100%);
            color: #050a06;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 168, 0, 0.4);
        }

        .hidden {
            display: none;
        }

        /* Estilos do Modal de PIX / Sucesso */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-card {
            background: #03150b;
            border: 1px solid #10e36b;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 20px rgba(16, 227, 107, 0.2);
            transition: all 0.3s ease;
        }

        .timer-badge {
            display: inline-block;
            background: rgba(255, 194, 0, 0.15);
            color: #ffc200;
            border: 1px solid #ffc200;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .success-icon {
            font-size: 50px;
            color: #10e36b;
            margin-bottom: 10px;
            animation: popIn 0.4s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <a href="valor.html" class="back-button">❮</a>
            <span style="color:#ffc200; font-weight:900;">ESCOLHA SEUS PALPITES</span>
            <div></div>
        </header>

        <div class="info-card">
            <span id="infoType">TIPO: -</span>
            <span id="infoValue">VALOR: R$ 0,00</span>
            <span id="infoLimit">LIMITE: 0</span>
        </div>

        <div id="groupsContainer" class="hidden">
            <h3 style="color:#10e36b; font-size: 12px; margin-bottom:8px;">SELECIONE O GRUPO:</h3>
            <div class="grid-numbers" id="gridGroups"></div>
        </div>

        <div id="dezenasContainer" class="hidden">
            <h3 style="color:#10e36b; font-size: 12px; margin-bottom:8px;">SELECIONE AS DEZENAS:</h3>
            <div class="grid-numbers" id="gridDezenas"></div>
        </div>

        <button class="submit-btn" id="confirmBet">FINALIZAR APOSTA ❯</button>
    </div>

    <script>
    const API_URL = 'https://bing-j6vi.onrender.com';
    const urlParams = new URLSearchParams(window.location.search);
    const betType = urlParams.get('type');
    const rawVal = parseFloat(urlParams.get('val'));
    const betVal = isNaN(rawVal) || rawVal < 1 ? 2.00 : rawVal; 
    const maxSelections = parseInt(urlParams.get('max')) || 1;

    let selectedItems = [];
    let timerInterval = null;
    let statusInterval = null;

    document.getElementById('infoType').textContent = `TIPO: ${betType === 'grupo' ? 'GRUPO' : 'DEZENA'}`;
    document.getElementById('infoValue').textContent = `VALOR: R$ ${betVal.toFixed(2)}`;
    document.getElementById('infoLimit').textContent = `LIMITE: ${maxSelections}`;

    if (betType === 'grupo') {
        const container = document.getElementById('groupsContainer');
        container.classList.remove('hidden');
        const grid = document.getElementById('gridGroups');

        for (let i = 1; i <= 25; i++) {
            const btn = document.createElement('button');
            btn.className = 'bet-num-btn';
            btn.textContent = i;
            btn.addEventListener('click', () => handleSelect(btn, i));
            grid.appendChild(btn);
        }
    } else {
        const container = document.getElementById('dezenasContainer');
        container.classList.remove('hidden');
        const grid = document.getElementById('gridDezenas');

        for (let i = 0; i <= 99; i++) {
            const btn = document.createElement('button');
            btn.className = 'bet-num-btn';
            const val = i.toString().padStart(2, '0');
            btn.textContent = val;
            btn.addEventListener('click', () => handleSelect(btn, val));
            grid.appendChild(btn);
        }
    }

    function handleSelect(btn, item) {
        if (selectedItems.includes(item)) {
            selectedItems = selectedItems.filter(i => i !== item);
            btn.classList.remove('selected');
        } else {
            if (selectedItems.length >= maxSelections) {
                alert(`Você pode selecionar no máximo ${maxSelections} opção(ões).`);
                return;
            }
            selectedItems.push(item);
            btn.classList.add('selected');
        }
    }

    document.getElementById('confirmBet').addEventListener('click', async () => {
        if (selectedItems.length === 0) {
            alert('Selecione ao menos um palpite.');
            return;
        }

        const btnConfirmar = document.getElementById('confirmBet');
        btnConfirmar.disabled = true;
        btnConfirmar.textContent = 'GERANDO PIX...';

        try {
            const response = await fetch(`${API_URL}/api/pagamentos/pix`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario_id: 1,
                    valor: betVal,
                    email_usuario: 'comprador.teste@gmail.com'
                })
            });

            const data = await response.json();

            if (response.ok && data.qr_code_base64) {
                exibirModalPix(data.qr_code_base64, data.qr_code, data.payment_id);
                iniciarTimerPix(15 * 60); // 15 minutos
                monitorarPagamento(data.payment_id);
            } else {
                alert(data.error || 'Erro ao gerar PIX.');
            }
        } catch (error) {
            console.error('Erro na requisição:', error);
            alert('Erro de conexão com o servidor.');
        } finally {
            btnConfirmar.disabled = false;
            btnConfirmar.textContent = 'FINALIZAR APOSTA ❯';
        }
    });

    function exibirModalPix(qrBase64, qrCode, paymentId) {
        let modal = document.getElementById('pixModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'pixModal';
            modal.className = 'modal-overlay';
            document.body.appendChild(modal);
        }

        modal.innerHTML = `
            <div class="modal-card" id="modalCard">
                <div class="timer-badge">⏳ PIX expira em: <span id="pixTimer">15:00</span></div>
                <h3 style="color: #ffc200; margin-bottom: 8px;">PAGAMENTO PIX</h3>
                <p style="font-size: 12px; margin-bottom: 12px; color: #ccc;">Escaneie o QR Code ou copie o código abaixo:</p>
                
                <img src="data:image/png;base64,${qrBase64}" alt="QR Code PIX" style="width: 170px; height: 170px; margin-bottom: 12px; border-radius: 8px; border: 2px solid #ffc200;"/>
                
                <textarea id="copiaColaText" readonly style="width: 100%; height: 50px; background: #010804; color: #10e36b; border: 1px solid #10e36b; border-radius: 6px; padding: 6px; font-size: 10px; margin-bottom: 12px; resize: none;">${qrCode}</textarea>
                
                <button id="copyBtn" style="width: 100%; height: 40px; background: #10e36b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px;">COPIAR CÓDIGO PIX</button>
                <button id="closeModalBtn" style="width: 100%; height: 35px; background: transparent; color: #ff5555; border: 1px solid #ff5555; border-radius: 8px; font-size: 12px; cursor: pointer;">CANCELAR</button>
            </div>
        `;

        document.getElementById('copyBtn').addEventListener('click', () => {
            const copyText = document.getElementById('copiaColaText');
            copyText.select();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(qrCode);
            }
            alert('Código PIX copiado!');
        });

        document.getElementById('closeModalBtn').addEventListener('click', fecharModal);

        modal.style.display = 'flex';
    }

    function iniciarTimerPix(duracaoSegundos) {
        clearInterval(timerInterval);
        let tempoRestante = duracaoSegundos;

        timerInterval = setInterval(() => {
            const min = Math.floor(tempoRestante / 60).toString().padStart(2, '0');
            const seg = (tempoRestante % 60).toString().padStart(2, '0');

            const timerEl = document.getElementById('pixTimer');
            if (timerEl) {
                timerEl.textContent = `${min}:${seg}`;
            }

            if (--tempoRestante < 0) {
                clearInterval(timerInterval);
                clearInterval(statusInterval);
                alert('O tempo para pagamento do PIX expirou.');
                fecharModal();
            }
        }, 1000);
    }

    function fecharModal() {
        clearInterval(timerInterval);
        clearInterval(statusInterval);
        const modal = document.getElementById('pixModal');
        if (modal) modal.style.display = 'none';
    }

    function monitorarPagamento(paymentId) {
        clearInterval(statusInterval);
        statusInterval = setInterval(async () => {
            try {
                const res = await fetch(`${API_URL}/api/pagamentos/status/${paymentId}`);
                const data = await res.json();

                if (data.status === 'approved') {
                    clearInterval(statusInterval);
                    clearInterval(timerInterval);
                    exibirSucesso();
                }
            } catch (err) {
                console.error('Erro ao verificar status:', err);
            }
        }, 3000);
    }

    function exibirSucesso() {
        const modalCard = document.getElementById('modalCard');
        if (!modalCard) return;

        modalCard.style.borderColor = '#10e36b';
        modalCard.style.boxShadow = '0 0 30px rgba(16, 227, 107, 0.6)';

        modalCard.innerHTML = `
            <div class="success-icon">✔</div>
            <h2 style="color: #10e36b; margin-bottom: 8px;">PAGAMENTO CONFIRMADO!</h2>
            <p style="font-size: 14px; color: #fff; margin-bottom: 16px;">Sua aposta foi registrada com sucesso.</p>
            <p style="font-size: 12px; color: #aaa;">Redirecionando para a tela inicial...</p>
        `;

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 3500);
    }
    </script>
</body>
</html>
