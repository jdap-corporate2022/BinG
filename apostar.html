<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03120a">
    <title>Escolha os Palpites - Bicho777Bet</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #020d07 radial-gradient(circle at 50% 25%, #083b1d 0%, #03150b 50%, #010804 100%) no-repeat fixed;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 12px;
            background: radial-gradient(ellipse at 50% 0%, rgba(0, 255, 100, 0.15) 0%, transparent 70%);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 50px;
            border-bottom: 1px solid rgba(0, 255, 120, 0.15);
            margin-bottom: 12px;
        }

        .back-button {
            color: #ffc200;
            font-size: 24px;
            text-decoration: none;
            font-weight: bold;
        }

        .balance-box {
            background: linear-gradient(180deg, #001f0d 0%, #001207 100%);
            border: 1px solid rgba(255, 194, 0, 0.4);
            border-radius: 8px;
            padding: 4px 10px;
            text-align: center;
        }

        .balance-label {
            display: block;
            font-size: 8px;
            color: #8da496;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .balance-box strong {
            font-size: 13px;
            color: #fff;
            font-weight: 800;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ffc200;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ffc200;
            font-weight: bold;
        }

        .grid-numbers {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-bottom: 16px;
        }

        .bet-num-btn {
            background: linear-gradient(180deg, #022e14 0%, #01190a 100%);
            border: 1px solid #10e36b;
            border-radius: 5px;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 8px 0;
            cursor: pointer;
            text-align: center;
        }

        .bet-num-btn.selected {
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 100%);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 6px #ffc200;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: 1px solid #fff2a3;
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 60%, #c47f00 100%);
            color: #050a06;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 168, 0, 0.4);
        }

        .hidden {
            display: none;
        }

        /* Estilos dos Pop-ups / Modais */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 16px;
        }

        .modal-card {
            background: #03150b;
            border: 1px solid #ffc200;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 194, 0, 0.25);
            animation: popIn 0.3s ease-out;
        }

        .modal-card-success {
            border-color: #10e36b;
            box-shadow: 0 0 20px rgba(16, 227, 107, 0.25);
        }

        .modal-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .btn-deposit {
            width: 100%;
            height: 45px;
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(243, 168, 0, 0.3);
        }

        .btn-cancel {
            width: 100%;
            height: 38px;
            background: transparent;
            color: #8da496;
            border: 1px solid #32503d;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <a href="valor.html" class="back-button">❮</a>
            <span style="color:#ffc200; font-weight:900;">ESCOLHA SEUS PALPITES</span>
            <div class="balance-box">
                <span class="balance-label">SALDO</span>
                <strong id="userBalance">R$ 0,00</strong>
            </div>
        </header>

        <div class="info-card">
            <span id="infoType">TIPO: -</span>
            <span id="infoValue">VALOR: R$ 0,00</span>
            <span id="infoLimit">LIMITE: 0</span>
        </div>

        <div id="groupsContainer" class="hidden">
            <h3 style="color:#10e36b; font-size: 12px; margin-bottom:8px;">SELECIONE O GRUPO:</h3>
            <div class="grid-numbers" id="gridGroups"></div>
        </div>

        <div id="dezenasContainer" class="hidden">
            <h3 style="color:#10e36b; font-size: 12px; margin-bottom:8px;">SELECIONE AS DEZENAS:</h3>
            <div class="grid-numbers" id="gridDezenas"></div>
        </div>

        <button class="submit-btn" id="confirmBet">FINALIZAR APOSTA ❯</button>
    </div>

    <!-- Pop-up Saldo Insuficiente -->
    <div id="balanceModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-icon">⚠️</div>
            <h2 style="color: #ffc200; font-size: 18px; margin-bottom: 8px;">SALDO INSUFICIENTE</h2>
            <p style="font-size: 13px; color: #d0e0d5; margin-bottom: 20px; line-height: 1.4;">
                Você não possui saldo suficiente para realizar esta aposta.
            </p>
            <button class="btn-deposit" onclick="window.location.href='deposito.html'">DEPOSITAR AGORA ❯</button>
            <button class="btn-cancel" onclick="fecharModalSaldo()">CANCELAR</button>
        </div>
    </div>

    <!-- Pop-up Sucesso -->
    <div id="successModal" class="modal-overlay" style="display: none;">
        <div class="modal-card modal-card-success">
            <div class="modal-icon" style="color: #10e36b;">✔</div>
            <h2 style="color: #10e36b; font-size: 18px; margin-bottom: 8px;">APOSTA REGISTRADA!</h2>
            <p style="font-size: 13px; color: #fff; margin-bottom: 12px;">Sua aposta foi confirmada com sucesso.</p>
            <p style="font-size: 11px; color: #8da496;">Redirecionando...</p>
        </div>
    </div>

    <script>
    const API_URL = 'https://bing-j6vi.onrender.com';
    const urlParams = new URLSearchParams(window.location.search);
    const betType = urlParams.get('type') || 'grupo';
    const rawVal = parseFloat(urlParams.get('val'));
    const betVal = isNaN(rawVal) || rawVal < 1 ? 2.00 : rawVal; 
    const maxSelections = parseInt(urlParams.get('max')) || 1;

    let selectedItems = [];
    let saldoAtual = 0;

    async function carregarSaldo() {
        try {
            const res = await fetch(`${API_URL}/api/usuario/1/saldo`);
            const data = await res.json();
            if (data.saldo !== undefined) {
                saldoAtual = data.saldo;
                document.getElementById('userBalance').textContent = `R$ ${saldoAtual.toFixed(2).replace('.', ',')}`;
            }
        } catch (err) {
            console.error('Erro ao carregar saldo:', err);
        }
    }

    document.getElementById('infoType').textContent = `TIPO: ${betType === 'grupo' ? 'GRUPO' : 'DEZENA'}`;
    document.getElementById('infoValue').textContent = `VALOR: R$ ${betVal.toFixed(2).replace('.', ',')}`;
    document.getElementById('infoLimit').textContent = `LIMITE: ${maxSelections}`;

    if (betType === 'grupo') {
        const container = document.getElementById('groupsContainer');
        container.classList.remove('hidden');
        const grid = document.getElementById('gridGroups');

        for (let i = 1; i <= 25; i++) {
            const btn = document.createElement('button');
            btn.className = 'bet-num-btn';
            btn.textContent = i;
            btn.addEventListener('click', () => handleSelect(btn, i.toString().padStart(2, '0')));
            grid.appendChild(btn);
        }
    } else {
        const container = document.getElementById('dezenasContainer');
        container.classList.remove('hidden');
        const grid = document.getElementById('gridDezenas');

        for (let i = 0; i <= 99; i++) {
            const btn = document.createElement('button');
            btn.className = 'bet-num-btn';
            const val = i.toString().padStart(2, '0');
            btn.textContent = val;
            btn.addEventListener('click', () => handleSelect(btn, val));
            grid.appendChild(btn);
        }
    }

    function handleSelect(btn, item) {
        if (selectedItems.includes(item)) {
            selectedItems = selectedItems.filter(i => i !== item);
            btn.classList.remove('selected');
        } else {
            if (selectedItems.length >= maxSelections) {
                alert(`Você pode selecionar no máximo ${maxSelections} opção(ões).`);
                return;
            }
            selectedItems.push(item);
            btn.classList.add('selected');
        }
    }


        // Função para validar se o usuário está logado
function validarAcesso() {
    const user = localStorage.getItem('user');
    if (!user) {
        alert('Você precisa estar logado para fazer uma aposta e gerar o pagamento!');
        window.location.href = 'login.html';
        return false;
    }
    return true;
}

// Exemplo: no evento de clique do botão "Gera PIX" ou "Confirmar Aposta"
document.getElementById('btnGerarPix').addEventListener('click', function(e) {
    if (!validarAcesso()) {
        e.preventDefault(); // Impede o envio se não estiver logado
        return;
    }

    // Segue o fluxo normal de gerar o PIX...
});
        

    document.getElementById('confirmBet').addEventListener('click', async () => {
        if (selectedItems.length === 0) {
            alert('Selecione ao menos um palpite.');
            return;
        }

        // Se o saldo for menor que o valor da aposta, abre o Pop-up com botão para Depositar
        if (saldoAtual < betVal) {
            document.getElementById('balanceModal').style.display = 'flex';
            return;
        }

        const btnConfirmar = document.getElementById('confirmBet');
        btnConfirmar.disabled = true;
        btnConfirmar.textContent = 'REGISTRANDO...';

        try {
            const response = await fetch(`${API_URL}/api/apostas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario_id: 1,
                    modalidade: betType === 'grupo' ? 'Grupo' : 'Dezena',
                    palpites: selectedItems,
                    valor: betVal
                })
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('successModal').style.display = 'flex';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2500);
            } else {
                alert(data.error || 'Erro ao registrar aposta.');
                btnConfirmar.disabled = false;
                btnConfirmar.textContent = 'FINALIZAR APOSTA ❯';
            }
        } catch (error) {
            console.error('Erro na requisição:', error);
            alert('Erro de conexão com o servidor.');
            btnConfirmar.disabled = false;
            btnConfirmar.textContent = 'FINALIZAR APOSTA ❯';
        }
    });

    function fecharModalSaldo() {
        document.getElementById('balanceModal').style.display = 'none';
    }

    carregarSaldo();
    </script>
</body>
</html>
