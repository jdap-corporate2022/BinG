<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03120a">
    <title>Escolha os Palpites - Bicho777Bet</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #020d07 radial-gradient(circle at 50% 25%, #083b1d 0%, #03150b 50%, #010804 100%) no-repeat fixed;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 12px;
            background: radial-gradient(ellipse at 50% 0%, rgba(0, 255, 100, 0.15) 0%, transparent 70%);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 50px;
            border-bottom: 1px solid rgba(0, 255, 120, 0.15);
            margin-bottom: 12px;
        }

        .back-button {
            color: #ffc200;
            font-size: 24px;
            text-decoration: none;
            font-weight: bold;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ffc200;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ffc200;
            font-weight: bold;
        }

        .grid-numbers {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-bottom: 16px;
        }

        .bet-num-btn {
            background: linear-gradient(180deg, #022e14 0%, #01190a 100%);
            border: 1px solid #10e36b;
            border-radius: 5px;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 8px 0;
            cursor: pointer;
            text-align: center;
        }

        .bet-num-btn.selected {
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 100%);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 6px #ffc200;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: 1px solid #fff2a3;
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 60%, #c47f00 100%);
            color: #050a06;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 168, 0, 0.4);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <a href="valor.html" class="back-button">❮</a>
            <span style="color:#ffc200; font-weight:900;">ESCOLHA SEUS PALPITES</span>
            <div></div>
        </header>

        <div class="info-card">
            <span id="infoType">TIPO: -</span>
            <span id="infoValue">VALOR: R$ 0,00</span>
            <span id="infoLimit">LIMITE: 0</span>
        </div>

        <!-- CONTAINER GRUPOS -->
        <div id="groupsContainer" class="hidden">
            <h3 style="color:#10e36b; font-size: 12px; margin-bottom:8px;">SELECIONE O GRUPO:</h3>
            <div class="grid-numbers" id="gridGroups"></div>
        </div>

        <!-- CONTAINER DEZENAS -->
        <div id="dezenasContainer" class="hidden">
            <h3 style="color:#10e36b; font-size: 12px; margin-bottom:8px;">SELECIONE AS DEZENAS:</h3>
            <div class="grid-numbers" id="gridDezenas"></div>
        </div>

        <button class="submit-btn" id="confirmBet">FINALIZAR APOSTA ❯</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const betType = urlParams.get('type');
        const betVal = urlParams.get('val');
        const maxSelections = parseInt(urlParams.get('max')) || 1;

        let selectedItems = [];

        document.getElementById('infoType').textContent = `TIPO: ${betType === 'grupo' ? 'GRUPO' : 'DEZENA'}`;
        document.getElementById('infoValue').textContent = `VALOR: R$ ${parseFloat(betVal).toFixed(2)}`;
        document.getElementById('infoLimit').textContent = `LIMITE: ${maxSelections}`;

        if (betType === 'grupo') {
            const container = document.getElementById('groupsContainer');
            container.classList.remove('hidden');
            const grid = document.getElementById('gridGroups');

            for (let i = 1; i <= 25; i++) {
                const btn = document.createElement('button');
                btn.className = 'bet-num-btn';
                btn.textContent = i;
                btn.addEventListener('click', () => handleSelect(btn, i));
                grid.appendChild(btn);
            }
        } else {
            const container = document.getElementById('dezenasContainer');
            container.classList.remove('hidden');
            const grid = document.getElementById('gridDezenas');

            for (let i = 0; i <= 99; i++) {
                const btn = document.createElement('button');
                btn.className = 'bet-num-btn';
                const val = i.toString().padStart(2, '0');
                btn.textContent = val;
                btn.addEventListener('click', () => handleSelect(btn, val));
                grid.appendChild(btn);
            }
        }

        function handleSelect(btn, item) {
            if (selectedItems.includes(item)) {
                selectedItems = selectedItems.filter(i => i !== item);
                btn.classList.remove('selected');
            } else {
                if (selectedItems.length >= maxSelections) {
                    alert(`Você pode selecionar no máximo ${maxSelections} opção(ões).`);
                    return;
                }
                selectedItems.push(item);
                btn.classList.add('selected');
            }
        }

        document.getElementById('confirmBet').addEventListener('click', () => {
            if (selectedItems.length === 0) {
                alert('Selecione ao menos um palpite.');
                return;
            }
            alert(`Aposta confirmada com sucesso!\nPalpites: ${selectedItems.join(', ')}\nValor: R$ ${betVal}`);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
