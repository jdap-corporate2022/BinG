<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo Restrito</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080d0a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; padding: 20px; }
        .hidden { display: none !important; }
        
        /* CARD LOGIN */
        .login-box { max-width: 380px; margin: 80px auto; background: #111a14; border: 1px solid #ffc200; padding: 24px; border-radius: 12px; }
        .login-title { font-size: 20px; color: #ffc200; font-weight: 800; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #10e36b; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #10e36b; background: #050a07; color: #fff; }
        .btn-admin { width: 100%; padding: 12px; background: #ffc200; border: none; font-weight: 900; cursor: pointer; border-radius: 6px; margin-top: 10px; }
        
        /* DASHBOARD ADMIN */
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: #111a14; border: 1px solid rgba(0,255,120,0.2); padding: 16px; border-radius: 8px; }
        .kpi-val { font-size: 24px; font-weight: 900; color: #ffc200; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA DE AUTENTICAÇÃO RESTREITA -->
        <div id="adminLoginView" class="login-box">
            <div class="login-title">ÁREA RESTRITA ADMIN</div>
            <form id="formAdminLogin">
                <div class="form-group">
                    <label>Telefone do Administrador</label>
                    <input type="tel" id="adminPhone" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn-admin">ACESSAR PAINEL 🔒</button>
            </form>
        </div>

        <!-- CONTEÚDO DO PAINEL ADMIN -->
        <div id="adminDashboardView" class="hidden">
            <header class="admin-header">
                <h2>Painel de Controle Bicho777Bet</h2>
                <button onclick="logoutAdmin()" style="background:#ff4444; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;">Sair</button>
            </header>

            <div class="kpi-grid">
                <div class="kpi-card">
                    <div>Total Depositado</div>
                    <div class="kpi-val" id="kpiDepositos">R$ 0,00</div>
                </div>
                <div class="kpi-card">
                    <div>Total de Saques</div>
                    <div class="kpi-val" id="kpiSaques">R$ 0,00</div>
                </div>
                <div class="kpi-card">
                    <div>Usuários Cadastrados</div>
                    <div class="kpi-val" id="kpiUsuarios">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://bing-j6vi.onrender.com';

        function verificarAutenticacaoAdmin() {
            const adminToken = localStorage.getItem('admin_token');
            if (adminToken) {
                document.getElementById('adminLoginView').classList.add('hidden');
                document.getElementById('adminDashboardView').classList.remove('hidden');
                carregarMetricas();
            }
        }

        document.getElementById('formAdminLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const telefone = document.getElementById('adminPhone').value;
            const senha = document.getElementById('adminPassword').value;

            try {
                const res = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone, senha })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('admin_token', data.token);
                    verificarAutenticacaoAdmin();
                } else {
                    alert(data.error || 'Acesso negado.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        });

        function logoutAdmin() {
            localStorage.removeItem('admin_token');
            location.reload();
        }

        async function carregarMetricas() {
            // Chamadas para métricas consolidadas
        }

        verificarAutenticacaoAdmin();
    </script>
</body>
</html>
