<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03120a">
    <title>Entrar / Cadastrar - Bicho777Bet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020d07 radial-gradient(circle at 50% 25%, #083b1d 0%, #03150b 50%, #010804 100%) no-repeat fixed;
            color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; justify-content: center; min-height: 100vh;
        }
        .app { width: 100%; max-width: 480px; padding: 20px; }
        .header { text-align: center; margin: 30px 0; }
        .brand-name { font-size: 28px; font-weight: 900; color: #ffc200; font-style: italic; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; border: 1px solid #10e36b; background: transparent;
            color: #10e36b; font-weight: 800; border-radius: 8px; cursor: pointer;
        }
        .tab-btn.active { background: #10e36b; color: #000; }

        .form-card {
            background: rgba(0, 31, 15, 0.9); border: 1px solid rgba(0, 255, 120, 0.3);
            border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #10e36b; font-weight: 700; margin-bottom: 4px; }
        input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(0,255,120,0.3);
            background: #011f0d; color: #fff; font-size: 14px; outline: none;
        }

        /* Estilização para o campo de senha com olho */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 42px;
        }
        .toggle-password-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #10e36b;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .submit-btn {
            width: 100%; height: 48px; border-radius: 10px; border: none;
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 100%);
            color: #000; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="brand-name">Bicho777Bet ♣</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="btnTabLogin" onclick="switchTab('login')">ENTRAR</button>
            <button class="tab-btn" id="btnTabCadastro" onclick="switchTab('cadastro')">CADASTRAR</button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="formLogin" class="form-card" action="/login" method="post">
            <div class="form-group">
                <label>Telefone / Celular</label>
                <input type="tel" id="loginTelefone" name="username" autocomplete="username" placeholder="(00) 90000-0000" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="loginSenha" name="password" autocomplete="current-password" placeholder="Sua senha" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePassword('loginSenha', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">ENTRAR ❯</button>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="formCadastro" class="form-card hidden" action="/register" method="post">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="cadNome" name="name" autocomplete="name" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label>Telefone / Celular</label>
                <input type="tel" id="cadTelefone" name="username" autocomplete="tel" placeholder="(00) 90000-0000" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="cadSenha" name="new-password" autocomplete="new-password" placeholder="Crie uma senha" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePassword('cadSenha', this)">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label>Confirmar Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="cadConfirmaSenha" name="confirm-password" autocomplete="new-password" placeholder="Repita a senha" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePassword('cadConfirmaSenha', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">CADASTRAR E ENTRAR ❯</button>
        </form>
    </div>

    <script>
        const API_URL = 'https://bing-j6vi.onrender.com';

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('formCadastro').classList.add('hidden');
                document.getElementById('btnTabLogin').classList.add('active');
                document.getElementById('btnTabCadastro').classList.remove('active');
            } else {
                document.getElementById('formLogin').classList.add('hidden');
                document.getElementById('formCadastro').classList.remove('hidden');
                document.getElementById('btnTabCadastro').classList.add('active');
                document.getElementById('btnTabLogin').classList.remove('active');
            }
        }

        // Função para mostrar/ocultar senha
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🔐';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Processar Login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const telefone = document.getElementById('loginTelefone').value.trim();
            const senha = document.getElementById('loginSenha').value;

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone, senha })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.usuario));
                    localStorage.setItem('token', data.token);
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Erro ao fazer login.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        });

        // Processar Cadastro
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('cadNome').value.trim();
            const telefone = document.getElementById('cadTelefone').value.trim();
            const senha = document.getElementById('cadSenha').value;
            const confirmaSenha = document.getElementById('cadConfirmaSenha').value;

            if (senha !== confirmaSenha) {
                alert('As senhas não coincidem!');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/auth/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, telefone, senha })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.usuario));
                    localStorage.setItem('token', data.token);
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Erro ao realizar cadastro.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>
</html>
