<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03120a">
    <title>Bicho777Bet - Início</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #020d07 radial-gradient(circle at 50% 25%, #083b1d 0%, #03150b 50%, #010804 100%) no-repeat fixed;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 255, 120, 0.15);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            color: #ffc200;
            letter-spacing: 1px;
        }

        .balance-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #10e36b;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            color: #10e36b;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-btn {
            width: 100%;
            height: 60px;
            border-radius: 14px;
            border: 1px solid #fff2a3;
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 60%, #c47f00 100%);
            color: #050a06;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 168, 0, 0.4);
            margin-top: auto;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">BICHO777BET</div>
            <div class="balance-card">
                <span>💰 Saldo:</span>
                <span id="userBalance">R$ 0,00</span>
            </div>
        </header>

        <div style="text-align: center; margin-top: 40px; color: #ccc;">
            <h3>Bem-vindo ao Bicho777Bet!</h3>
            <p style="font-size: 13px; margin-top: 8px;">Escolha o valor e faça sua aposta com facilidade via PIX.</p>
        </div>

        <a href="valor.html" class="main-btn">FAZER APOSTA ❯</a>
    </div>

    <script>
        const API_URL = 'https://bing-j6vi.onrender.com';

        async function carregarSaldo() {
            try {
                const res = await fetch(`${API_URL}/api/usuario/1/saldo`);
                const data = await res.json();
                if (data.saldo !== undefined) {
                    document.getElementById('userBalance').textContent = `R$ ${data.saldo.toFixed(2)}`;
                }
            } catch (err) {
                console.error('Erro ao carregar saldo:', err);
            }
        }

        carregarSaldo();
    </script>
</body>
</html>
