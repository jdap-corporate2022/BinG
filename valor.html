<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03120a">
    <title>Escolha o Valor - Bicho777Bet</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #020d07 radial-gradient(circle at 50% 25%, #083b1d 0%, #03150b 50%, #010804 100%) no-repeat fixed;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 12px;
            background: radial-gradient(ellipse at 50% 0%, rgba(0, 255, 100, 0.15) 0%, transparent 70%);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 50px;
            border-bottom: 1px solid rgba(0, 255, 120, 0.15);
            margin-bottom: 16px;
        }

        .back-button {
            color: #ffc200;
            font-size: 24px;
            text-decoration: none;
            font-weight: bold;
        }

        .title {
            color: #ffc200;
            font-size: 18px;
            font-weight: 900;
        }

        .section-box {
            border: 1px solid #10e36b;
            border-radius: 12px;
            padding: 12px;
            background: rgba(1, 20, 9, 0.8);
            margin-bottom: 16px;
        }

        .section-title {
            color: #ffc200;
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-bottom: 10px;
            text-align: center;
        }

        .group-table th {
            background: rgba(0, 255, 120, 0.1);
            color: #10e36b;
            padding: 4px;
            border: 1px solid rgba(0, 255, 120, 0.2);
        }

        .group-table td {
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ddd;
        }

        .option-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #ffc200;
            background: linear-gradient(180deg, #022e14 0%, #01190a 100%);
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .option-btn.selected {
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 100%);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 194, 0, 0.5);
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: 1px solid #fff2a3;
            background: linear-gradient(180deg, #ffdb33 0%, #f3a800 60%, #c47f00 100%);
            color: #050a06;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 168, 0, 0.4);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <a href="index.html" class="back-button">❮</a>
            <span class="title">MODALIDADE E VALOR</span>
            <div></div>
        </header>

        <!-- MODO GRUPO FECHADO -->
        <div class="section-box">
            <div class="section-title">1. GRUPO FECHADO (R$ 8,00 / GP)</div>
            <table class="group-table">
                <thead>
                    <tr>
                        <th>GP.</th><th>Cotas</th>
                        <th>GP.</th><th>Cotas</th>
                        <th>GP.</th><th>Cotas</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>01</td><td>01-04</td><td>02</td><td>05-08</td><td>05</td><td>09-12</td></tr>
                </tbody>
            </table>
            <button class="option-btn" data-type="grupo" data-val="8" data-max="1">
                <span>GRUPO FECHADO</span>
                <span>R$ 8,00</span>
            </button>
        </div>

        <!-- MODO DEZENAS ALEATÓRIAS -->
        <div class="section-box">
            <div class="section-title">2. DEZENAS ALEATÓRIAS</div>
            <button class="option-btn" data-type="dezena" data-val="2" data-max="1">
                <span>1 DEZENA</span><span>R$ 2,00</span>
            </button>
            <button class="option-btn" data-type="dezena" data-val="3" data-max="2">
                <span>ATÉ 2 DEZENAS</span><span>R$ 3,00</span>
            </button>
            <button class="option-btn" data-type="dezena" data-val="5" data-max="3">
                <span>ATÉ 3 DEZENAS</span><span>R$ 5,00</span>
            </button>
            <button class="option-btn" data-type="dezena" data-val="10" data-max="5">
                <span>ATÉ 5 DEZENAS</span><span>R$ 10,00</span>
            </button>
            <button class="option-btn" data-type="dezena" data-val="20" data-max="10">
                <span>ATÉ 10 DEZENAS</span><span>R$ 20,00</span>
            </button>
            <button class="option-btn" data-type="dezena" data-val="50" data-max="25">
                <span>ATÉ 25 DEZENAS (MAX)</span><span>R$ 50,00</span>
            </button>
        </div>

        <button class="submit-btn" id="nextBtn">CONTINUAR PARA PALPITES ❯</button>
    </div>

    <script>
        let selectedOption = null;

        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedOption = {
                    type: btn.dataset.type,
                    val: btn.dataset.val,
                    max: btn.dataset.max
                };
            });
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (!selectedOption) {
                alert('Selecione uma opção de aposta para continuar.');
                return;
            }
            window.location.href = `apostar.html?type=${selectedOption.type}&val=${selectedOption.val}&max=${selectedOption.max}`;
        });
    </script>
</body>
</html>
